<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Las 13 fuentes agrupadas por como se leen: APIs JSON, RSS y Algolia, HTML del servidor y SPAs con Playwright; con canal remoto y canal local">
  <!-- Fuentes de cli/run_discover.py y src/boards/. "local" = busca en el pais del candidato. -->
  <rect x="1" y="1" width="998" height="468" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">

    <!-- APIs JSON -->
    <g transform="translate(30 30)">
      <rect width="455" height="196" rx="16" fill="#161b22" stroke="#ffc940" stroke-width="2"/>
      <text x="24" y="44" fill="#ffc940" font-size="21" font-weight="700">APIs JSON</text>
      <text x="24" y="68" fill="#8b949e" font-size="14">la via mas estable: piden el nivel en la consulta</text>
      <g font-size="15" fill="#e6edf3">
        <text x="24" y="106">GetOnBrd</text><text x="240" y="106">Himalayas</text>
        <text x="24" y="136">4 Day Week</text><text x="240" y="136">Remote First Jobs</text>
        <text x="24" y="166">Working Nomads</text><text x="240" y="166">Remotive</text>
      </g>
    </g>

    <!-- RSS y Algolia -->
    <g transform="translate(515 30)">
      <rect width="455" height="196" rx="16" fill="#161b22" stroke="#00B894" stroke-width="2"/>
      <text x="24" y="44" fill="#3fdd78" font-size="21" font-weight="700">RSS y Algolia</text>
      <text x="24" y="68" fill="#8b949e" font-size="14">feeds publicos, sin login</text>
      <g font-size="15" fill="#e6edf3">
        <text x="24" y="106">We Work Remotely</text><text x="240" y="106" fill="#8b949e" font-size="13">RSS</text>
        <text x="24" y="136">Hacker News</text><text x="240" y="136" fill="#8b949e" font-size="13">"Who is hiring", via Algolia</text>
      </g>
    </g>

    <!-- HTML -->
    <g transform="translate(30 246)">
      <rect width="455" height="196" rx="16" fill="#161b22" stroke="#0984E3" stroke-width="2"/>
      <text x="24" y="44" fill="#74b9ff" font-size="21" font-weight="700">HTML del servidor</text>
      <text x="24" y="68" fill="#8b949e" font-size="14">httpx + BeautifulSoup</text>
      <g font-size="15" fill="#e6edf3">
        <text x="24" y="106">LinkedIn</text><text x="240" y="106" fill="#8b949e" font-size="13">jobs-guest, sin login</text>
        <text x="24" y="136">LinkedIn local</text><text x="240" y="136" fill="#8b949e" font-size="13">en tu pais</text>
        <text x="24" y="166">Computrabajo</text><text x="240" y="166" fill="#8b949e" font-size="13">local, por subdominio</text>
      </g>
    </g>

    <!-- Playwright -->
    <g transform="translate(515 246)">
      <rect width="455" height="196" rx="16" fill="#161b22" stroke="#6C5CE7" stroke-width="2"/>
      <text x="24" y="44" fill="#a29bfe" font-size="21" font-weight="700">SPAs con Playwright</text>
      <text x="24" y="68" fill="#8b949e" font-size="14">Chromium headless para las que exigen JS</text>
      <g font-size="15" fill="#e6edf3">
        <text x="24" y="106">LinkedIn con sesion</text><text x="240" y="106" fill="#8b949e" font-size="13">storage_state guardado</text>
        <text x="24" y="136">Multitrabajos</text><text x="240" y="136" fill="#8b949e" font-size="13">local, Ecuador</text>
      </g>
    </g>
  </g>
</svg>
