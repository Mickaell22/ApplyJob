<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Flujo de ApplyJob: 13 fuentes de ofertas pasan por filtros y matcher sin gastar API; tu revisas la lista y solo la carta que pides usa DeepSeek">
  <!-- Flujo real: cli/run_discover.py (descubre, filtra, puntua: 0 API) -> candidates_<fecha>.json
       -> revision humana -> cli/gen_cover.py (evaluador + carta con DeepSeek). Sin cifras: no hay
       una corrida medida publicada. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p1" d="M232 200 L 268 200"/>
    <path id="p2" d="M448 200 L 478 200"/>
    <path id="p3" d="M638 200 L 668 200"/>
    <path id="p4" d="M790 200 L 826 200"/>
  </defs>

  <rect x="1" y="1" width="998" height="418" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- zonas: 0 API vs API -->
    <rect x="22" y="24" width="790" height="372" rx="16" fill="none" stroke="#3fdd78" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="44" y="54" fill="#3fdd78" font-size="14" font-weight="700" letter-spacing="2">SIN GASTAR API</text>
    <rect x="820" y="24" width="158" height="372" rx="16" fill="none" stroke="#ffc940" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="899" y="54" text-anchor="middle" fill="#ffc940" font-size="14" font-weight="700" letter-spacing="2">USA API</text>

    <!-- 1: fuentes -->
    <text x="44" y="96" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="2">13 FUENTES</text>
    <g font-size="14" fill="#e6edf3">
      <rect x="44" y="110" width="188" height="38" rx="8" fill="#161b22" stroke="#30363d"/><rect x="44" y="110" width="5" height="38" rx="2" fill="#ffc940"/>
      <text x="60" y="134">APIs JSON</text>
      <rect x="44" y="156" width="188" height="38" rx="8" fill="#161b22" stroke="#30363d"/><rect x="44" y="156" width="5" height="38" rx="2" fill="#ffc940"/>
      <text x="60" y="180">RSS y Algolia</text>
      <rect x="44" y="202" width="188" height="38" rx="8" fill="#161b22" stroke="#30363d"/><rect x="44" y="202" width="5" height="38" rx="2" fill="#ffc940"/>
      <text x="60" y="226">HTML del servidor</text>
      <rect x="44" y="248" width="188" height="38" rx="8" fill="#161b22" stroke="#30363d"/><rect x="44" y="248" width="5" height="38" rx="2" fill="#ffc940"/>
      <text x="60" y="272">SPAs con Playwright</text>
    </g>
    <text x="44" y="318" fill="#8b949e" font-size="13">todo a un mismo esquema</text>

    <!-- conectores -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="5 6" fill="none">
      <use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/>
    </g>

    <!-- 2: filtros -->
    <rect x="268" y="110" width="180" height="180" rx="14" fill="#161b22" stroke="#E17055" stroke-width="2"/>
    <text x="358" y="142" text-anchor="middle" fill="#ff9f80" font-size="18" font-weight="700">Filtros</text>
    <g font-size="13" fill="#c9d1d9">
      <text x="288" y="174">1  stack tecnico</text>
      <text x="288" y="200">2  sin senior / lead</text>
      <text x="288" y="226">3  sin "3+ años"</text>
      <text x="288" y="252">4  tu region</text>
    </g>
    <text x="358" y="278" text-anchor="middle" fill="#8b949e" font-size="12">en cascada</text>

    <!-- 3: matcher -->
    <rect x="478" y="138" width="160" height="124" rx="14" fill="#161b22" stroke="#6C5CE7" stroke-width="2"/>
    <text x="558" y="182" text-anchor="middle" fill="#a29bfe" font-size="18" font-weight="700">Matcher</text>
    <text x="558" y="208" text-anchor="middle" fill="#c9d1d9" font-size="13">tu stack vs la oferta</text>
    <text x="558" y="230" text-anchor="middle" fill="#8b949e" font-size="12">alta · media · baja</text>

    <!-- 4: lista + tu -->
    <rect x="668" y="138" width="122" height="124" rx="14" fill="#161b22" stroke="#3fdd78" stroke-width="2"/>
    <text x="729" y="180" text-anchor="middle" fill="#3fdd78" font-size="16" font-weight="700">Lista corta</text>
    <text x="729" y="204" text-anchor="middle" fill="#c9d1d9" font-size="13">tu revisas</text>
    <text x="729" y="224" text-anchor="middle" fill="#c9d1d9" font-size="13">los links</text>
    <text x="729" y="292" text-anchor="middle" fill="#8b949e" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11">candidates.json</text>

    <!-- 5: carta -->
    <g>
      <rect x="836" y="128" width="126" height="144" rx="12" fill="#2a2210" stroke="#ffc940" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="899" y="166" text-anchor="middle" fill="#ffc940" font-size="16" font-weight="700">Carta</text>
      <text x="899" y="190" text-anchor="middle" fill="#c9d1d9" font-size="13">solo la que</text>
      <text x="899" y="208" text-anchor="middle" fill="#c9d1d9" font-size="13">eliges</text>
      <text x="899" y="236" text-anchor="middle" fill="#8b949e" font-size="12">DeepSeek</text>
      <text x="899" y="254" text-anchor="middle" fill="#8b949e" font-size="12">es / en</text>
    </g>

    <!-- particulas -->
    <g>
      <circle r="5" fill="#ffc940"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="5" fill="#ffc940"><animateMotion dur="1.2s" begin="-0.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="5" fill="#ff9f80"><animateMotion dur="1.2s" begin="-0.3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="4" fill="#a29bfe"><animateMotion dur="1.4s" begin="-0.5s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="4" fill="#3fdd78"><animateMotion dur="2.4s" begin="-0.9s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    </g>

    <text x="417" y="370" text-anchor="middle" fill="#8b949e" font-size="13">Listar candidatas no llama a ningun modelo: lo que se descarta, se descarta antes de gastar un token.</text>
  </g>
</svg>
